#This is a basic workflow
name: CI/CD Pipeline

#Controls when the workflow will run 
on:
  #Triggers the workflow on push or pull request events but only for the main or develop branch
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

  #Allow you to run this workflow manually from the actions tab
  workflow_dispatch:

#A workflow run is made upof one or more jobs that can run sequentially or in parallel
jobs:
  #This workflow contains a single job called "build"
  build:
    #the type of runner that the job will run on
    runs-on: ubuntu-latest
    
    #Steps represents a sequence of tasks that will be executed as part of the job 
    steps:
    #Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v3

    #Runs a single command using the runners shell  
    - name: Run a one-line script
      run: echo hello, world

    #Runs a multiple command using the runners shell  
    - name: Run a multi-line script
      run: 
        echo add other actions to build,
        echo test, and deploy yout project.
    

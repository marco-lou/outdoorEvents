name: Run Tests

on:
  #push:
    #branches:
      #- main
    #pull_request:
    # branches:
        #  - main
  workflow_dispatch:
 
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del codice
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Impostare Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      # 3. Installare le dipendenze
      - name: Install dependencies
        run: npm install

      # 4. Eseguire i test
      - name: Run tests
        run: npm test
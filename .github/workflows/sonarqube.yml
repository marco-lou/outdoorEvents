name: SonarCloud Manual Scan

on:
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    #Il job test viene eseguito 3 volte in parallelo, una per ogni versione 
    #di Node.js specificata nella matrice: 14, 16 e 18. Questo consente di 
    #verificare che l'app funzioni correttamente su più versioni di Node.

    #strategy:
    #  matrix:
    #   node-version: [14, 16, 18]
    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      #- name: Set up Java 17
      #  uses: actions/setup-java@v3
      #  with:
      #    distribution: 'temurin'
      #    java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'  #se matrix -> ${{ matrix.node-version }}

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install
     

      - name: Run tests with coverage
        #id: test
        run: npm run test -- --coverage
  
      # verifica tutti i steps di sopra 
      #- name: upload test report
      #  if: failure()  o usa if:steps.test.outcome == 'failure' per lo step precedente
      #  uses: actions/upload-artifact@v3
      #  with:
      #    name: test-report #se con matrix -> ${{ matrix.node-version }}-test-report
      #    path: htmlcov/

      - name: Check if coverage report exists
        run: ls -l coverage/lcov.info


      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Send log to Loki
        uses: istone-you/send-log-to-loki@v1
        with:
          message: "SonarCloud scan completed with coverage"
          measurement: "finish"
          loki_address: https://logs-prod-039.grafana.net/loki/api/v1/push
          loki_username: ${{ secrets.LOKI_USERNAME }}
          loki_password: ${{ secrets.LOKI_PASSWORD }}
          labels: '{"workflow": "sonarcloud", "job": "scan", "status": "success"}'